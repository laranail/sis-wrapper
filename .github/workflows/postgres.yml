name: PostgreSQL triggers

# The storage-layer immutability guarantee (§6.4) is enforced by PostgreSQL triggers — an append-only audit
# table, a frozen commissioned row, no serial reuse. These tests need a real PostgreSQL, so they run here
# only (never in the SQLite-backed local suite). The `pgsql` group holds them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triggers:
    name: Trigger enforcement · PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sis
          POSTGRES_PASSWORD: sis
          POSTGRES_DB: sis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sis_test
      DB_USERNAME: sis
      DB_PASSWORD: sis

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, pdo, pgsql, pdo_pgsql
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Run the PostgreSQL trigger tests
        run: vendor/bin/phpunit --group pgsql
